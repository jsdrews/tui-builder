# Generated by `tui-builder gen` from testdata/writes/spec.yaml (Jobs 1).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen spec.yaml

# Not generated:
#   POST /jobs/{job_id}/logs: a multipart body (a file upload), which gen doesn't send
#   DELETE /jobs/{job_id}/tags/{tag}: needs a second path parameter, and a row fills only one: add it in overrides
#   PUT /jobs/{job_id}/schedule: `cron` is an object, which an input can't fill: add it in overrides
#   POST /login: no list to attach it to
app:
  title: Jobs
  version: "1"
  env:
    - name: JOBS_API_URL
      default: https://jobs.example.com
      description: Base URL for Jobs.
  action_groups: [read, write]
data:
  presets:
    jobs_api:
      type: http
      url: ${env.JOBS_API_URL}
  sources:
    jobs:
      extends: jobs_api
      url: /jobs
    job:
      extends: jobs_api
      url: /jobs/${params.job_id}
      parameters:
        job_id: {required: true, segment: true}
actions:
  open_job: {push: job}
  create_job:
    extends: jobs_api
    method: POST
    url: /jobs
    query: {dry_run: '${inputs.dry_run}'}
    json:
      name: ${inputs.name}
      state: ${inputs.state}
      priority: ${inputs.priority}
      paused: ${inputs.paused}
      secret: ${inputs.secret}
    # spec is an object, so it isn't asked for: add it in overrides.
    inputs:
      # Optional true/false: blank leaves it out. (A bool input is always one or the other.)
      dry_run: {options: ["", "true", "false"], order: 1}
      name: {required: true, validate: 'value matches ''^[a-z0-9-]+$''', invalid: 'must match ^[a-z0-9-]+$', order: 2}
      state: {options: ["", queued, running, done, failed], order: 3}
      # A number, typed as text: the server has to accept it as a string.
      priority: {order: 4}
      # Optional true/false: blank leaves it out. (A bool input is always one or the other.)
      paused: {options: ["", "true", "false"], label: 'Paused (default: false)', order: 5}
      secret: {mask: true, order: 6}
    message: created ${body.name} (r to refresh)
  replace_job:
    extends: jobs_api
    method: PUT
    url: /jobs/${inputs.job_id}
    json:
      name: ${inputs.name}
      state: ${inputs.state}
      priority: ${inputs.priority}
      paused: ${inputs.paused}
      secret: ${inputs.secret}
    # spec is an object, so it isn't asked for: add it in overrides.
    inputs:
      job_id: {required: true, segment: true}
      name: {required: true, validate: 'value matches ''^[a-z0-9-]+$''', invalid: 'must match ^[a-z0-9-]+$', order: 1}
      state: {options: ["", queued, running, done, failed], order: 2}
      # A number, typed as text: the server has to accept it as a string.
      priority: {order: 3}
      # Optional true/false: blank leaves it out. (A bool input is always one or the other.)
      paused: {options: ["", "true", "false"], label: 'Paused (default: false)', order: 4}
      secret: {mask: true, order: 5}
    message: replaced (r to refresh)
  delete_job:
    extends: jobs_api
    method: DELETE
    url: /jobs/${inputs.job_id}
    inputs:
      job_id: {required: true, segment: true}
    message: deleted (r to refresh)
    multi: true
  restart_job:
    extends: jobs_api
    method: POST
    url: /jobs/${inputs.job_id}/restart
    inputs:
      job_id: {required: true, segment: true}
    message: 'restart job: done (r to refresh)'
    multi: true
  add_a_note:
    extends: jobs_api
    method: POST
    url: /jobs/${inputs.job_id}/notes
    form:
      text: ${inputs.text}
    inputs:
      job_id: {required: true, segment: true}
      text: {required: true, validate: len(value) <= 500, invalid: at most 500 characters, order: 1}
    message: 'add a note: done (r to refresh)'
tui:
  components:
    jobs:
      type: table
      title: Jobs
      source: jobs
      filterable: true
      markable: true
      mark_key: id
      columns:
        - {title: Name, value: name, sortable: true, bold: true, flex: 1}
        - title: State
          value: state
          sortable: true
          max_width: 20
          color_rules:
            - {when: queued, color: 'theme:warning'}
            - {when: running, color: 'theme:success'}
            - {when: done, color: 'theme:success'}
            - {when: failed, color: 'theme:error'}
            - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error'}
            - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning'}
        - {title: Paused, value: paused, sortable: true, max_width: 20}
        - {title: Id, value: id, sortable: true, sort: number, align: right}
        - {title: Priority, value: priority, sortable: true, sort: number, align: right}
        - {title: Image, value: spec.image, sortable: true}
    job:
      type: inspector
      title: Job
      source: job
      auto: true
      color_rules:
        - {when: queued, color: 'theme:warning', path: state}
        - {when: running, color: 'theme:success', path: state}
        - {when: done, color: 'theme:success', path: state}
        - {when: failed, color: 'theme:error', path: state}
        - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error', path: state}
        - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning', path: state}
  initial: jobs
  screens:
    jobs:
      title: Jobs
      layout: {component: jobs}
      actions:
        - {key: enter, action: open_job, label: Job, from: jobs, bind: {job_id: '${selection.Id}'}}
        - {key: n, action: create_job, label: Create a job}
        - {key: p, action: replace_job, label: Replace, from: jobs, bind: {job_id: '${selection.Id}'}}
        - {key: d, action: delete_job, label: Delete, from: jobs, bind: {job_id: '${selection.Id}'}, confirm: 'Delete ${selection.Name}?'}
        - {key: b, action: restart_job, label: Restart job, from: jobs, bind: {job_id: '${selection.Id}'}}
        - {key: c, action: add_a_note, label: Add a note, from: jobs, bind: {job_id: '${selection.Id}'}}
    job:
      title: Job ${selection.Name}
      layout: {component: job}

# Operations in the spec, to spot new ones when it's generated again:
#   GET /jobs, POST /jobs, GET /jobs/{job_id}, PUT /jobs/{job_id},
#   DELETE /jobs/{job_id}, POST /jobs/{job_id}/restart,
#   POST /jobs/{job_id}/logs, DELETE /jobs/{job_id}/tags/{tag},
#   POST /jobs/{job_id}/notes, PUT /jobs/{job_id}/schedule, POST /login
