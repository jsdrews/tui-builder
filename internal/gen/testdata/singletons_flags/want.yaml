# Generated by `tui-builder gen` from testdata/singletons_flags/spec.yaml (Status Service 2.4.0).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen spec.yaml --prompt-server --name status --tag account
app:
  title: Status Service
  version: 2.4.0
  env:
    - name: STATUS_URL
      default: https://eu.status.example.com/v2
      description: Base URL for Status Service.
    - name: STATUS_API_KEY
      required: true
      description: Your key from the dashboard.
      # from: {command: [pass, show, status/api_key]}
      # from: {file: ~/.config/status/api_key}
  prompts:
    - key: STATUS_URL
      label: Server
      options: ['https://eu.status.example.com/v2', 'https://staging.status.example.com/v2']
      default: https://eu.status.example.com/v2
data:
  presets:
    status:
      type: http
      # Other servers in the spec:
      #   https://staging.status.example.com/v2 (Staging)
      # {region} is one of eu, us, ap.
      url: ${env.STATUS_URL}
      auth: {api_key: {in: header, name: X-API-Key, value: '${env.STATUS_API_KEY}'}}
      # The API documents rate limits (429 or Retry-After).
      retry: {}
  sources:
    me:
      extends: status
      url: /me
    settings:
      extends: status
      url: /settings
tui:
  components:
    me:
      type: inspector
      title: Who I am
      source: me
      auto: true
    settings:
      type: inspector
      title: Settings
      source: settings
      auto: true
  initial: home
  screens:
    home:
      title: Status Service
      tabs:
        - label: Who I am
          layout: {component: me}
        - label: Settings
          layout: {component: settings}

# Operations in the spec, to spot new ones when it's generated again:
