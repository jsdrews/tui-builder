# Generated by `tui-builder gen` from testdata/singletons/spec.yaml (Status Service 2.4.0).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen spec.yaml

# Not generated:
#   GET /report.csv: answers text/csv, not JSON
#   GET /legacy: deprecated (keep it with --include-deprecated)
#   GET /tenant: needs the header parameter "X-Tenant", which gen can't fill
#   webhook incident: the API calls it, not the other way round
app:
  title: Status Service
  version: 2.4.0
  env:
    - name: STATUS_SERVICE_URL
      default: https://eu.status.example.com/v2
      description: Base URL for Status Service.
    - name: STATUS_SERVICE_API_KEY
      required: true
      description: Your key from the dashboard.
      # from: {command: [pass, show, status-service/api_key]}
      # from: {file: ~/.config/status-service/api_key}
data:
  presets:
    status_service:
      type: http
      # Other servers in the spec:
      #   https://staging.status.example.com/v2 (Staging)
      # (--prompt-server asks which at startup.)
      # {region} is one of eu, us, ap.
      url: ${env.STATUS_SERVICE_URL}
      auth: {api_key: {in: header, name: X-API-Key, value: '${env.STATUS_SERVICE_API_KEY}'}}
      # The API documents rate limits (429 or Retry-After).
      retry: {}
  sources:
    me:
      extends: status_service
      url: /me
    health:
      extends: status_service
      url: /health
      # This operation takes no auth.
      unset: [auth]
    incidents:
      extends: status_service
      url: /incidents
    settings:
      extends: status_service
      url: /settings
tui:
  components:
    me:
      type: inspector
      title: Who I am
      source: me
      auto: true
    health:
      type: inspector
      title: Health
      source: health
      auto: true
      color_rules:
        - {when: ok, color: 'theme:success', path: status}
        - {when: degraded, color: 'theme:warning', path: status}
        - {when: down, color: 'theme:error', path: status}
        - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error', path: status}
        - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning', path: status}
    incidents:
      type: table
      title: Incidents
      source: incidents
      filterable: true
      columns:
        - {title: Id, value: id, sortable: true, sort: number, bold: true, flex: 1}
    settings:
      type: inspector
      title: Settings
      source: settings
      auto: true
  initial: home
  screens:
    home:
      title: Status Service
      tabs:
        - label: Who I am
          layout: {component: me}
        - label: Health
          layout: {component: health}
        - label: Incidents
          layout: {component: incidents}
        - label: Settings
          layout: {component: settings}

# Operations in the spec, to spot new ones when it's generated again:
#   GET /me, GET /health, GET /report.csv, GET /legacy, GET /tenant,
#   GET /incidents, GET /settings
