# push_actions.yaml — screen pushes as actions.
#
# A push is an action: `push:` names a screen in `tui.screens:`, and the
# binding's `bind:` fills that screen's declared `parameters:`. There is
# no separate `on_key:` block any more — one registry, one place a key
# can come from.
#
# How a push is reached:
#
#   key: enter   fires directly (double-click is its mouse spelling).
#                The classic drilldown.
#   key: <other> a MENU shortcut — dispatches while `a` is open, does
#                nothing pressed on the screen itself.
#   no key       menu-only. A parallel drilldown no longer has to earn
#                a letter to exist.
#
# This demo uses the same GitHub users → repo drilldown as the vanilla
# http example but exposes TWO push targets on the same list:
#
#   users  enter → repo table (all this user's public repos)
#          (menu) → starred (what THIS user has starred)
#   repos  enter → repo detail (inspector over one repo)
#
# Both destinations bind `${selection}` = the focused login into their
# parameterized source, so the same list feeds two different views.
#
# The third level shows how far a binding can reach: each push binds
# only from the component the CURRENT screen displays. By the time you
# are on the repos table the login is gone, so repo_detail is keyed by
# the `owner/repo` slug that the table itself carries in a column. If a
# child needs a value, the parent has to show it.
#
# A double click on a row is the mouse spelling of enter, so both
# drilldowns work from the mouse too.
app:
  title: GitHub (key pushes)
  theme: nord

data:
  sources:
    users:
      type: http
      url: https://api.github.com/users?per_page=30
      refresh: 10m
      timeout: 15s

    repos_by_user:
      type: http
      parameters:
        login: {type: string, required: true, description: GitHub login}
      url:     https://api.github.com/users/${params.login}/repos?per_page=30&sort=updated
      refresh: 10m
      timeout: 15s

    starred_by_user:
      type: http
      parameters:
        login: {type: string, required: true, description: GitHub login}
      url:     https://api.github.com/users/${params.login}/starred?per_page=30
      refresh: 10m
      timeout: 15s

    # Third level. Parameterized by the full `owner/repo` slug rather
    # than a bare name because the repo endpoint needs both halves, and
    # the repos table already has the slug in a column — a push can only
    # bind what its source component displays.
    repo_detail:
      type: http
      parameters:
        full_name: {type: string, required: true, description: "owner/repo slug"}
      url:     https://api.github.com/repos/${params.full_name}
      refresh: 10m
      timeout: 15s

tui:
  components:
    users_list:
      type: list
      title: Users
      filterable: true
      source: users
      item: login

    repos_table:
      type: table
      title: ${selection} — repos
      filterable: true
      source: repos_by_user
      initial_sort: {column: Stars, desc: true}
      columns:
        # full_name, not name: this column is what `enter` binds into
        # repo_detail's `full_name` param, and the API wants owner/repo.
        - {title: Repo,     width: 32, sortable: true,                       value: full_name}
        - {title: Language, width: 14, sortable: true,                       value: language}
        - {title: Stars,    width: 8,  sortable: true, sort: number, align: right, value: stargazers_count}
        - {title: Updated,  width: 22, sortable: true,                       value: updated_at}

    starred_table:
      type: table
      title: ${selection} — starred
      filterable: true
      source: starred_by_user
      initial_sort: {column: Stars, desc: true}
      columns:
        - {title: Repo,     width: 40, sortable: true,                       value: full_name}
        - {title: Language, width: 14, sortable: true,                       value: language}
        - {title: Stars,    width: 8,  sortable: true, sort: number, align: right, value: stargazers_count}

    repo_inspector:
      type: inspector
      title: ${selection.Repo}
      filterable: true
      initial_depth: 2
      source: repo_detail
      auto: true
      #      fields:
      #        - {label: Full name,      path: full_name}
      #        - {label: Description,    path: description}
      #        - {label: Homepage,       path: homepage}
      #        - {label: Language,       path: language}
      #        - {label: License,        path: "license.spdx_id"}
      #        - {label: Default branch, path: default_branch}
      #        - label: Stats
      #          children:
      #            - {label: Stars,       path: stargazers_count}
      #            - {label: Forks,       path: forks_count}
      #            - {label: Open issues, path: open_issues_count}
      #        - label: Timestamps
      #          children:
      #            - {label: Created, path: created_at}
      #            - {label: Updated, path: updated_at}
      #            - {label: Pushed,  path: pushed_at}

  screens:
    users:
      title: Users
      layout: {component: users_list}
      actions:
        # enter → user's own repos (classic drilldown; spell key explicitly)
        - key:    enter
          name:   open_repos
          push:   repos
          from:   users_list
          bind:
            login: ${selection}
        # What the user has starred — NO key at all. Press `a` and pick
        # it. A parallel drilldown no longer has to earn a letter to
        # exist, which is the whole point of the menu. `label:` is what
        # the menu shows.
        - name:   open_starred
          push:   starred
          from:   users_list
          label:  starred
          bind:
            login: ${selection}

    repos:
      title: ${selection} — repos
      layout: {component: repos_table}
      actions:
        # Third level: enter on a repo row opens its detail. Each screen
        # binds only from the row IT shows — the login picked two screens
        # back is long out of scope here, which is why the slug travels
        # in the Repo column rather than being reassembled from parts.
        - key:    enter
          name:   open_repo_detail
          push:   repo_detail
          from:   repos_table
          bind:
            full_name: ${selection.Repo}

    starred:
      title: ${selection} — starred
      layout: {component: starred_table}

    repo_detail:
      title: ${selection.Repo}
      layout: {component: repo_inspector}

  initial: users
