# An example input from `tui-builder init input`. Run it with
#   tui-builder <this file>
# Every field a input takes is below, commented out: uncomment a line to
# use it. A line shows the field's default where it has one; a block
# shows every field it takes, so keep the ones you need.
# https://jsdrews.github.io/tui-builder/reference/components/#input

app:
  title: demo

data:
  sources:
    services:
      # The input's value reaches this source as ${params.q}.
      type: exec
      parameters:
        q: {type: string, default: ""}
      command:
        - sh
        - -c
        - |
          printf 'api\nworker\nweb\ncron\n' | grep -i -- "${params.q}" \
            | awk 'BEGIN{printf "["} {printf "%s{\"name\":\"%s\"}", (NR>1?",":""), $1} END{print "]"}'

tui:
  components:
    search:
      type: input
      title: Search

      # Common fields: https://jsdrews.github.io/tui-builder/reference/components/#common-fields
      # colors:                         # Per-component color overrides.
      #   border_active: ""             # Border color when focused.
      #   border_inactive: ""           # Border color when unfocused.
      #   spinner: ""                   # The loading spinner.

      # Input fields: https://jsdrews.github.io/tui-builder/reference/components/#input
      # initial: ""                     # The value before anything is committed.
      # placeholder: ""                 # Shown while the field is empty.
      # char_limit: 0                   # The longest value accepted.
      # mask: false                     # Shows typed characters as bullets (`app.glyphs.mask`).
    services:
      type: table
      title: Services
      source: services
      on_input:
        bind: {q: "${input.search}"}
      columns:
        - {title: Name, value: name}

  screen:
    layout:
      vstack:
        - {fixed: 3, component: search}
        - {component: services}
