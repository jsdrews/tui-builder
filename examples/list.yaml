# list.yaml — a single filterable list.
#
# Keys when focused:
#   j / ↓ / k / ↑    move cursor
#   g / G            top / bottom
#   ctrl+u / ctrl+d  half page
#   /                engage filter (esc to clear)
#   ← / → / h / l    horizontal scroll on long items
app:
  title: List Demo
  theme: nord

tui:
  components:
    fruits:
      type: list
      title: Fruits
      filterable: true
      items:
        - Apple
        - Apricot
        - Banana
        - Blueberry
        - Cherry
        - Date
        - Elderberry
        - Fig
        - Grape
        - Honeydew
        - Kiwi
        - Lemon
        - Mango
        - Nectarine
        - Orange
        - Papaya
        - Quince
        - Raspberry
        - Strawberry
        - Tangerine
  screen:
    title: Fruits
    layout:
      component: fruits
