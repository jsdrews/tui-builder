# Generated by `tui-builder gen` from testdata/lists_edge/spec.yaml (Edges 1).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen spec.yaml

# Not generated:
#   GET /mixed: the response has several lists and none is named entries, items, data or results: set root in overrides
#   GET /reports/{report_slug}/raw: one object under an item, neither a list nor the item itself: gen pushes lists and details
#   GET /count: answers a single value, not an object or a list
#   GET /ping: no response schema
#   GET /orgs/{org}/repos/{repo}: `{org}` and `{repo}` need a list to pick each from, and a push can carry only one: add it in overrides
app:
  title: Edges
  version: "1"
  env:
    - name: EDGES_URL
      default: https://edges.example.com
      description: Base URL for Edges.
  prompts:
    - key: EDGES_KIND
      label: Kind
      options: [daily, weekly]
      description: Which report.
      required: true
    - key: EDGES_LIMIT
      label: Limit
      type: int
      required: true
    - key: EDGES_ORG
      label: Org
      required: true
data:
  presets:
    edges:
      type: http
      url: ${env.EDGES_URL}
  sources:
    tags:
      extends: edges
      url: /tags
    reports:
      extends: edges
      url: /reports
      root: data
      query: {kind: '${env.EDGES_KIND}', limit: '${env.EDGES_LIMIT}'}
    report:
      extends: edges
      url: /reports/${params.report_slug}
      parameters:
        report_slug: {required: true, segment: true}
    org_members:
      extends: edges
      url: /orgs/${env.EDGES_ORG}/members
    tag:
      extends: edges
      url: /tags/${params.tag}
      parameters:
        tag: {required: true, segment: true}
actions:
  open_report: {push: report}
  open_tag: {push: tag}
tui:
  components:
    tags:
      type: table
      title: Tags
      source: tags
      filterable: true
      columns:
        - {title: Value, value: ., sortable: true}
    reports:
      type: table
      title: Reports
      source: reports
      filterable: true
      columns:
        - {title: Title, value: title, sortable: true, bold: true, flex: 1}
        - {title: Slug, value: slug, sortable: true}
    report:
      type: inspector
      title: Report
      source: report
      auto: true
    org_members:
      type: table
      title: Org members
      source: org_members
      filterable: true
      columns:
        - {title: Login, value: login, sortable: true, bold: true, flex: 1}
    tag:
      type: inspector
      title: Tag
      source: tag
      auto: true
  initial: home
  screens:
    home:
      title: Edges
      tabs:
        - label: Tags
          layout: {component: tags}
          actions:
            - {key: enter, action: open_tag, label: Tag, from: tags, bind: {tag: '${selection.Value}'}}
        - label: Reports
          layout: {component: reports}
          actions:
            - {key: enter, action: open_report, label: Report, from: reports, bind: {report_slug: '${selection.Slug}'}}
        - label: Org members
          layout: {component: org_members}
    report:
      title: Report ${selection.Title}
      layout: {component: report}
    tag:
      title: Tag ${selection.Value}
      layout: {component: tag}

# Operations in the spec, to spot new ones when it's generated again:
#   GET /tags, GET /mixed, GET /reports, GET /reports/{report_slug},
#   GET /reports/{report_slug}/raw, GET /count, GET /ping,
#   GET /orgs/{org}/members, GET /orgs/{org}/repos/{repo}, GET /tags/{tag}
