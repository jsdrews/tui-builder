# Generated by `tui-builder gen` from ../fixture/things/things.yaml (Things API 1.0.0).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen things.yaml --read-only
app:
  title: Things API
  version: 1.0.0
  env:
    - name: THINGS_API_URL
      default: http://localhost:8765
      description: Base URL for Things API.
    - name: THINGS_API_TOKEN
      required: true
      description: Bearer token for Things API.
      # from: {command: [pass, show, things-api/token]}
      # from: {file: ~/.config/things-api/token}
data:
  presets:
    things_api:
      type: http
      url: ${env.THINGS_API_URL}
      auth: {bearer: '${env.THINGS_API_TOKEN}'}
  sources:
    things:
      extends: things_api
      url: /things
      root: entries
      window:
        page_param: page
        limit_param: per_page
        page_size: 100
        total_path: total
        sort_param: order_by
        sort_fields: [name, created_at, size, status]
        sort_desc_prefix: '-'
        filters: {Status: status, Owner id: owner_id}
    thing:
      extends: things_api
      url: /things/${params.thing_id}
      parameters:
        thing_id: {required: true, segment: true}
    owners:
      extends: things_api
      url: /owners
      root: entries
      window:
        page_param: page
        limit_param: per_page
        page_size: 100
        total_path: total
        sort_param: order_by
        sort_fields: [name]
        sort_desc_prefix: '-'
    owner:
      extends: things_api
      url: /owners/${params.owner_id}
      parameters:
        owner_id: {required: true, segment: true}
    owner_things:
      extends: things_api
      url: /owners/${params.owner_id}/things
      parameters:
        owner_id: {required: true, segment: true}
      root: entries
      window:
        page_param: page
        limit_param: per_page
        page_size: 100
        total_path: total
actions:
  open_thing: {push: thing}
  open_owner: {push: owner}
  open_owner_things: {push: owner_things}
tui:
  components:
    things:
      type: table
      title: Things
      source: things
      filterable: true
      columns:
        - {title: Name, value: name, bold: true}
        - title: Status
          value: status
          distinct: [active, pending, failed, archived]
          max_width: 20
          color_rules:
            - {when: active, color: 'theme:success'}
            - {when: pending, color: 'theme:warning'}
            - {when: failed, color: 'theme:error'}
            - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error'}
            - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning'}
        - {title: Created at, value: created_at, align: right}
        - {title: Id, value: id, align: right}
        - {title: Size, value: size, align: right}
        - {title: Owner id, value: owner_id, align: right}
        - {title: Tags, value: tags}
        - {title: Description, value: description, flex: 1}
        # More fields from the schema; uncomment one to add it:
        # - {title: Team, value: labels.team}
        # - {title: Env, value: labels.env}
    thing:
      type: inspector
      title: Thing
      source: thing
      auto: true
      color_rules:
        - {when: active, color: 'theme:success', path: status}
        - {when: pending, color: 'theme:warning', path: status}
        - {when: failed, color: 'theme:error', path: status}
        - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error', path: status}
        - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning', path: status}
    owners:
      type: table
      title: Owners
      source: owners
      columns:
        - {title: Name, value: name, bold: true, flex: 1}
        - {title: Id, value: id, align: right}
        - {title: Email, value: email}
    owner:
      type: inspector
      title: Owner
      source: owner
      auto: true
    owner_things:
      type: table
      title: Things
      source: owner_things
      columns:
        - {title: Name, value: name, bold: true}
        - title: Status
          value: status
          distinct: [active, pending, failed, archived]
          max_width: 20
          color_rules:
            - {when: active, color: 'theme:success'}
            - {when: pending, color: 'theme:warning'}
            - {when: failed, color: 'theme:error'}
            - {when: ~(fail|error|crash|backoff|unhealthy|fatal|critical|denied|reject|oom|evict), color: 'theme:error'}
            - {when: ~(pend|wait|progress|degrad|unknown|warn|terminat|queue|retry), color: 'theme:warning'}
        - {title: Created at, value: created_at, align: right}
        - {title: Id, value: id, align: right}
        - {title: Size, value: size, align: right}
        - {title: Owner id, value: owner_id, align: right}
        - {title: Tags, value: tags}
        - {title: Description, value: description, flex: 1}
        # More fields from the schema; uncomment one to add it:
        # - {title: Team, value: labels.team}
        # - {title: Env, value: labels.env}
  initial: home
  screens:
    home:
      title: Things API
      tabs:
        - label: Things
          layout: {component: things}
          actions:
            - {key: enter, action: open_thing, label: Thing, from: things, bind: {thing_id: '${selection.Id}'}}
        - label: Owners
          layout: {component: owners}
          actions:
            - {key: enter, action: open_owner, label: Owner, from: owners, bind: {owner_id: '${selection.Id}'}}
            - {key: i, action: open_owner_things, label: Things, from: owners, bind: {owner_id: '${selection.Id}'}}
    thing:
      title: Thing ${selection.Name}
      layout: {component: thing}
    owner:
      title: Owner ${selection.Name}
      layout: {component: owner}
    owner_things:
      title: ${selection.Name}'s things
      layout: {component: owner_things}

# Operations in the spec, to spot new ones when it's generated again:
#   GET /things, POST /things, GET /things/{thing_id},
#   PATCH /things/{thing_id}, DELETE /things/{thing_id}, GET /owners,
#   GET /owners/{owner_id}, GET /owners/{owner_id}/things
