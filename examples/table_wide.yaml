# table_wide.yaml — a table wider than the terminal, to exercise the
# table's horizontal scroll.
#
# Keys when focused (in addition to the usual j/k, g/G, /, [/]/s):
#   ← / → / h / l        scroll by HScrollStep cells
#   shift+← / shift+→    snap viewport to previous / next column boundary
#   0 / home             jump to the leftmost edge
#   $ / end              jump to the rightmost edge
#
# The thin bottom row inside the pane is the horizontal scrollbar
# (theme.Table() enables it by default).
app:
  title: Wide Table
  theme: nord

tui:
  components:
    deploys:
      type: table
      title: Deployments
      filterable: true
      initial_sort: {column: Updated, desc: true}
      columns:
