app:
  title: Keyed
  version: "1"
  env:
    - name: KEYED_URL
      default: https://api.example.com
      description: Base URL for Keyed.
    - name: KEYED_APP_ID_API_KEY
      required: true
      description: API key for Keyed (AppId).
      # from: {command: [pass, show, keyed/app_id_api_key]}
      # from: {file: ~/.config/keyed/app_id_api_key}
    - name: KEYED_APP_KEY_API_KEY
      required: true
      description: API key for Keyed (AppKey).
      # from: {command: [pass, show, keyed/app_key_api_key]}
      # from: {file: ~/.config/keyed/app_key_api_key}
    - name: KEYED_SESSION_TOKEN
      required: true
      description: Bearer token for Keyed (Session).
      # from: {command: [pass, show, keyed/session_token]}
      # from: {file: ~/.config/keyed/session_token}
data:
  presets:
    keyed:
      type: http
      url: ${env.KEYED_URL}
      auth: {api_key: {in: query, name: app_id, value: '${env.KEYED_APP_ID_API_KEY}'}}
      headers: {X-App-Key: '${env.KEYED_APP_KEY_API_KEY}', Authorization: 'Bearer ${env.KEYED_SESSION_TOKEN}'}
  sources:
    account:
      extends: keyed
      url: /account
tui:
  components:
    account:
      type: inspector
      title: Account
      source: account
      auto: true
  initial: account
  screens:
    account:
      title: Account
      layout: {component: account}

