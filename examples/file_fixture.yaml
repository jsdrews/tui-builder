# file_fixture.yaml — read a JSON file off disk. Useful for fixtures,
# offline demos, and any "I generated this nightly" workflow.
#
# `refresh: 5s` re-reads the file on every tick so you can edit the
# fixture in another window and watch the table update. With `refresh:`
# unset, the file is read once on screen entry; press `r` to re-read.
app:
  title: Fixture file
  theme: nord

data_sources:
  fixture:
    type: file
    path: ./examples/fixtures/people.json
    root: people
    refresh: 5s

components:
  people_table:
    type: table
    title: People
    filterable: true
    source: fixture
    initial_sort: {column: Name, desc: false}
    columns:
      - {title: Name,    width: 18, sortable: true, value: name}
      - {title: Role,    width: 16, sortable: true, value: role}
      - {title: Team,    width: 14, sortable: true, value: team}
      - {title: Joined,  width: 12, sortable: true, value: joined}

screen:
  title: People
  layout:
    component: people_table
