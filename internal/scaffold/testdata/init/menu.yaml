# An example menu from `tui-builder init menu`. Run it with
#   tui-builder <this file>
# Every field a menu takes is below, commented out: uncomment a line to
# use it. A line shows the field's default where it has one; a block
# shows every field it takes, so keep the ones you need.
# https://jsdrews.github.io/tui-builder/reference/components/#menu

app:
  title: demo
  surface: filled

data:
  sources:
    services:
      type: static
      data:
        - {name: api,    status: running}
        - {name: worker, status: running}
        - {name: web,    status: pending}
    volumes:
      type: static
      data:
        - {name: data, size: 20G}
        - {name: logs, size: 4G}
    instance:
      # Each menu item that opens this screen fills ${params.engine}
      # through its bind:.
      type: exec
      parameters:
        engine: {type: string, required: true}
      command: [sh, -c, "printf '[{\"engine\":\"%s\",\"status\":\"up\"}]' '${params.engine}'"]

tui:
  components:
    home:
      type: menu
      title: Sections
      items:
        - {group: compute,  label: Services, screen: services, description: "what's running"}
        - {group: storage,  label: Volumes,  screen: volumes,  description: "disks and their sizes"}
        - {group: database, label: postgres, screen: instance, description: "the postgres instance", bind: {engine: postgres}}
        - {group: database, label: mysql,    screen: instance, description: "the mysql instance",    bind: {engine: mysql}}
        - {label: About, screen: about, description: "no group, so it goes last, under other"}

        # Every menu item field: https://jsdrews.github.io/tui-builder/reference/components/#menu
        # - label: Label                # The item's text. (required)
        #   screen: services            # The screen in `tui.screens` the item opens. (required)
        #   group: ""                   # The heading the item sits under.
        #   description: ""             # Drawn dimmed beside the label, cut off when space runs
        #                               # out.
        #   bind: {}                    # Fills the destination's source `parameters:`, as a push
        #                               # binding's `bind:` does.

      # Common fields: https://jsdrews.github.io/tui-builder/reference/components/#common-fields
      # colors:                         # Per-component color overrides.
      #   border_active: ""             # Border color when focused.
      #   border_inactive: ""           # Border color when unfocused.
      #   spinner: ""                   # The loading spinner.
    services:
      type: table
      title: Services
      filterable: true
      source: services
      columns:
        - {title: Name,   value: name}
        - {title: Status, value: status}
    volumes:
      type: table
      title: Volumes
      filterable: true
      source: volumes
      columns:
        - {title: Name, value: name}
        - {title: Size, value: size, align: right}
    instance:
      type: inspector
      title: Instance
      filterable: true
      source: instance
      auto: true
    about:
      type: textview
      title: About
      searchable: true
      content: |
        Opened from the menu; esc goes back. / filters the menu on label
        and group, and [ / ] jump between groups.

  initial: home
  screens:
    home:
      layout:
        component: home
    services:
      title: Services
      layout:
        component: services
    volumes:
      title: Volumes
      layout:
        component: volumes
    instance:
      title: Instance
      layout:
        component: instance
    about:
      title: About
      layout:
        component: about
