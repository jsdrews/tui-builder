# inputs.yaml — an input that drives a source.
#
# `type: input` is a one-line text field. It doesn't display a source:
# other components read its committed value as ${input.NAME} and
# refetch when it changes.
#
#   tab      move onto the Search field and start typing
#   enter    commit — the table refetches with the new query
#   esc      put the committed text back and leave the field
#
# The table's source is an exec command with a parameter; `on_input`
# binds it. It runs once at start with the `initial:` values, then on
# every commit. The same token works in actions: `enter` on a row echoes
# the current search alongside the pod's name.
app:
  surface: filled
  title: Inputs
  theme: nord

actions:
  note:
    description: Echo the focused pod and the search that found it
    inputs:
      name: {required: true}
    run: [echo, "${inputs.name} (search: ${input.search})"]

data:
  sources:
    pods:
      type: exec
      parameters:
        q: {type: string, default: ""}
      # A fixture of pods; grep -i filters by the query.
      command:
        - sh
        - -c
        - |
          rows='web Running
          api CrashLoopBackOff
          db Running
          old-batch Deleted'
          printf '%s\n' "$rows" | sed 's/^ *//' \
            | grep -i -- "${params.q}" \
            | awk 'BEGIN{printf "["} {printf "%s{\"name\":\"%s\",\"status\":\"%s\"}", (NR>1?",":""), $1, $2} END{print "]"}'

tui:
  components:
    search:
      type: input
      title: Search
      placeholder: name…
    pods_table:
      type: table
      title: Pods
      source: pods
      on_input:
        bind: {q: "${input.search}"}
      columns:
        - {title: Name, value: name, flex: 1}
        - title: Status
          value: status
          color_rules:
            - {when: Running, color: green}
            - {when: "~Crash", color: red}
            - {when: Deleted, color: gray}

  screen:
    title: Inputs
    layout:
      vstack:
        - {component: search}
        - {component: pods_table}
    actions:
      - {key: enter, action: note, from: pods_table, bind: {name: "${selection}"}, group: write}
