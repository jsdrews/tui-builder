        - {title: Service,    width: 20, sortable: true}
        - {title: Cluster,    width: 18, sortable: true}
        - {title: Namespace,  width: 16, sortable: true}
        - {title: Image,      width: 30, sortable: true}
        - {title: Commit,     width: 12}
        - {title: Replicas,   width: 10, sortable: true, sort: number, align: right}
        - {title: CPU,        width: 8,  sortable: true, sort: si,     align: right}
        - {title: Memory,     width: 10, sortable: true, sort: si,     align: right}
        - {title: Health,     width: 10, align: center}
        - {title: Updated,    width: 12, sortable: true, sort: si,     align: right}
