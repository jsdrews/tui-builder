# http_github_auth.yaml — authenticated GitHub demo.
#
# Drilldown:    /user/starred (your starred repos)  →  /repos/{full_name} (repo detail)
#
# Requires:     export GITHUB_TOKEN=ghp_...    (any classic PAT or fine-grained
#                                               token with `repo:read` is fine)
#
# Auth pattern: `auth: {bearer: "${env.GITHUB_TOKEN}"}`, once, in the
# `github` preset with the rest of what every GitHub request shares. The
# token never lives in YAML, and it's masked as ••• anywhere it could show
# up: error messages, the output console, `wrangl --describe`. If
# GITHUB_TOKEN is unset, the source fails with
# "auth: bearer is empty (${env.GITHUB_TOKEN} is unset)" rather than
# sending an anonymous request.
#
# Why authenticated:
#   - Rate limit jumps from 60/hr to 5000/hr.
#   - /user/starred needs auth to know whose stars to return.
#   - You can swap to /user/repos to include private repos.
app:
  surface: filled
  title: GitHub (auth)
  theme: nord
  env:
    - name:        GITHUB_TOKEN
      required:    true
      description: "Classic PAT or fine-grained token with repo:read scope. https://github.com/settings/tokens"

data:
  presets:
    github:
      type: http
      url: https://api.github.com
      refresh: 10m
      timeout: 15s
      headers:
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      auth:
        bearer: ${env.GITHUB_TOKEN}
      # Ride out a blip or a rate limit; polls send If-None-Match on
      # their own, and GitHub doesn't charge 304s against the limit.
      retry: {max: 3}

  sources:
    starred:
      extends: github
      url: /user/starred?per_page=50&sort=updated

    repo_detail:
      extends: github
      url: /repos/${selection.Repo}

tui:
  components:
    starred_table:
      type: table
      title: ${env.USER}'s starred repos
      filterable: true
      source: starred
      initial_sort: {column: Stars, desc: true}
      columns:
        - {title: Repo,        width: 32, sortable: true,                       value: full_name}
        - {title: Language,    width: 14, sortable: true,                       value: language}
        - {title: Stars,       width: 8,  sortable: true, sort: number, align: right, value: stargazers_count}
        - {title: Updated,     width: 22, sortable: true,                       value: updated_at}
        - {title: Description, width: 40,                                       value: description}

    repo_inspector:
      type: inspector
      title: ${selection.Repo}
      filterable: true
      initial_depth: 2
      source: repo_detail
      fields:
        - {label: Full name,      path: full_name}
        - {label: Description,    path: description}
        - {label: Homepage,       path: homepage}
        - {label: Default branch, path: default_branch}
        - {label: License,        path: "license.spdx_id"}
        - {label: Language,       path: language}
        - {label: Visibility,     path: visibility}
        - label: Stats
          children:
            - {label: Stars,       path: stargazers_count}
            - {label: Watchers,    path: subscribers_count}
            - {label: Forks,       path: forks_count}
            - {label: Open issues, path: open_issues_count}
            - {label: Size (KB),   path: size}
        - label: Timestamps
          children:
            - {label: Created, path: created_at}
            - {label: Updated, path: updated_at}
            - {label: Pushed,  path: pushed_at}
        - label: Owner
          children:
            - {label: Login,     path: "owner.login"}
            - {label: Type,      path: "owner.type"}
            - {label: HTML URL,  path: "owner.html_url"}
  screens:
    starred:
      title: Starred
      layout: {component: starred_table}
      actions:
        - {key: enter, name: open_detail, push: detail, from: starred_table}

    detail:
      title: ${selection.Repo}
      layout: {component: repo_inspector}
  initial: starred
