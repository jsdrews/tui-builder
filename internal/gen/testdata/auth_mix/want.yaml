# Generated by `tui-builder gen` from testdata/auth_mix/spec.yaml (Auth Mix 1).
# Don't edit it: change the flags (or put changes in an --overrides file) and generate it again.
#   tui-builder gen spec.yaml
app:
  title: Auth Mix
  version: "1"
  env:
    - name: AUTH_MIX_URL
      default: https://api.example.com
      description: Base URL for Auth Mix.
    - name: AUTH_MIX_TOKEN
      required: true
      description: Bearer token for Auth Mix.
      # from: {command: [pass, show, auth-mix/token]}
      # from: {file: ~/.config/auth-mix/token}
    - name: AUTH_MIX_MACHINE_CLIENT_ID
      required: true
      description: OAuth2 client ID for Auth Mix.
      # from: {command: [pass, show, auth-mix/machine_client_id]}
      # from: {file: ~/.config/auth-mix/machine_client_id}
    - name: AUTH_MIX_MACHINE_CLIENT_SECRET
      required: true
      description: OAuth2 client secret for Auth Mix.
      # from: {command: [pass, show, auth-mix/machine_client_secret]}
      # from: {file: ~/.config/auth-mix/machine_client_secret}
    - name: AUTH_MIX_BASIC_USER
      required: true
      description: User name for Auth Mix.
      # from: {command: [pass, show, auth-mix/basic_user]}
      # from: {file: ~/.config/auth-mix/basic_user}
    - name: AUTH_MIX_BASIC_PASSWORD
      required: true
      description: Password for Auth Mix.
      # from: {command: [pass, show, auth-mix/basic_password]}
      # from: {file: ~/.config/auth-mix/basic_password}
    - name: AUTH_MIX_BROWSER_TOKEN
      required: true
      description: Bearer token for Auth Mix.
      # from: {command: [pass, show, auth-mix/browser_token]}
      # from: {file: ~/.config/auth-mix/browser_token}
data:
  presets:
    auth_mix:
      type: http
      url: ${env.AUTH_MIX_URL}
      # The API also accepts: Key.
      auth: {bearer: '${env.AUTH_MIX_TOKEN}'}
  sources:
    me:
      extends: auth_mix
      url: /me
    billing:
      extends: auth_mix
      url: /billing
      # This operation uses another scheme.
      auth:
        oauth2:
          token_url: https://auth.example.com/token
          client_id: ${env.AUTH_MIX_MACHINE_CLIENT_ID}
          client_secret: ${env.AUTH_MIX_MACHINE_CLIENT_SECRET}
          scopes: [billing.read]
    admin:
      extends: auth_mix
      url: /admin
      # This operation uses another scheme.
      auth: {basic: {user: '${env.AUTH_MIX_BASIC_USER}', pass: '${env.AUTH_MIX_BASIC_PASSWORD}'}}
    partner:
      # This operation uses the mutualTLS scheme "Mtls", which tui-builder can't send.
      extends: auth_mix
      url: /partner
    dash:
      extends: auth_mix
      url: /dash
      # This operation uses another scheme.
      # This API signs in with OAuth2 authorization code, which tui-builder can't do itself. Get a token
      # another way (a CLI, a password manager) and set from: on AUTH_MIX_BROWSER_TOKEN.
      auth: {bearer: '${env.AUTH_MIX_BROWSER_TOKEN}'}
tui:
  components:
    me:
      type: inspector
      title: Me
      source: me
      auto: true
    billing:
      type: inspector
      title: Billing
      source: billing
      auto: true
    admin:
      type: inspector
      title: Admin
      source: admin
      auto: true
    partner:
      type: inspector
      title: Partner
      source: partner
      auto: true
    dash:
      type: inspector
      title: Dash
      source: dash
      auto: true
  initial: home
  screens:
    home:
      title: Auth Mix
      tabs:
        - label: Me
          layout: {component: me}
        - label: Billing
          layout: {component: billing}
        - label: Admin
          layout: {component: admin}
        - label: Partner
          layout: {component: partner}
        - label: Dash
          layout: {component: dash}

# Operations in the spec, to spot new ones when it's generated again:
#   GET /me, GET /billing, GET /admin, GET /partner, GET /dash
