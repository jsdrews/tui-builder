# action_prompts.yaml — actions that collect input before running.
#
# There is no `prompts:` schema. An action declares typed `inputs:`, and
# anything the binding doesn't fill via `bind:` is collected in a form
# generated from those same input declarations. One vocabulary, one
# namespace (${inputs.*}), and the form can't drift out of step with the
# argv because it's derived from it.
#
# The widget follows the data type:
#   (default)          single-line text input
#   options: [...]     select, whatever the type
#   type: bool         yes/no toggle
#
# Flow when an action fires:
#   1. bind: templates resolve against the focused row
#   2. any input still unset (and without a default) opens a form
#   3. (if confirm:) a modal, which can preview ${inputs.*}
#   4. dispatch — output streams into the output console (press `o`)
#
# Every action here runs `echo`, so nothing external is needed: press
# `o` after firing one to see the substituted argv in the console.
app:
  title: Action inputs demo
  theme: nord

# The actions themselves — reusable, inspectable without a TTY:
#   wrangl --list-actions examples/action_prompts.yaml
#   wrangl --describe-action examples/action_prompts.yaml order --param fruit=Apple
actions:
  request:
    description: Ask for a quantity, then echo it
    inputs:
      # Bound from the selected row, so it never reaches the form.
      fruit:  {type: string, required: true}
      # Not bound by the binding below → this is what gets prompted for.
      amount: {label: "How many?", placeholder: "1", order: 1}
    run: [echo, "${inputs.amount} ${inputs.fruit}(s) requested"]

  order:
    description: Multi-field order form
    inputs:
      fruit:    {type: string, required: true}
      amount:   {label: Quantity, placeholder: "1", order: 1}
      # Options make it a select regardless of type; `default:` names the
      # starting choice by value rather than by index.
      priority: {label: Priority, options: [low, normal, high], default: normal, order: 2}
      # A bool renders the yes/no toggle.
      gift:     {label: "Gift wrap?", type: bool, default: "false", order: 3}
    run:
      - sh
      - -c
      - 'echo "ordered: ${inputs.amount} × ${inputs.fruit}, priority=${inputs.priority}, gift=${inputs.gift}"'
    message: "ordered ${inputs.amount} × ${inputs.fruit}"

tui:
  components:
    fruits:
      type: list
      title: Pick a fruit, then press a key for an action
      filterable: true
      items:
        - Apple
        - Banana
        - Cherry
        - Date
  screen:
    title: Inputs
    layout:
      component: fruits
    actions:
      # `n`, not `q`: q quits the app, and the validator now rejects any
      # action bound to a reserved key. (This example previously bound
      # `q` here — the action could never fire, because the app shell
      # consumed the key first and quit.)
      - key: n
        action: request
        label: request
        from: fruits
        bind: {fruit: "${selection}"}

      - key: enter
        action: order
        label: order
        from: fruits
        # The confirm message previews values the form just collected.
        confirm: "Order ${inputs.amount} ${selection}(s) as ${inputs.priority} priority?"
        bind: {fruit: "${selection}"}
