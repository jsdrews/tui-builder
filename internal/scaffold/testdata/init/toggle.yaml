# An example toggle from `tui-builder init toggle`. Run it with
#   tui-builder <this file>
# Every field a toggle takes is below, commented out: uncomment a line to
# use it. A line shows the field's default where it has one; a block
# shows every field it takes, so keep the ones you need.
# https://jsdrews.github.io/tui-builder/reference/components/#toggle

app:
  title: demo

data:
  sources:
    services:
      # The toggle's value reaches this source as ${params.stopped}.
      type: exec
      parameters:
        stopped: {type: bool, default: "false"}
      command:
        - sh
        - -c
        - |
          printf 'api running\nweb running\ncron stopped\n' \
            | { if [ "${params.stopped}" = true ]; then cat; else grep -v stopped; fi; } \
            | awk 'BEGIN{printf "["} {printf "%s{\"name\":\"%s\",\"status\":\"%s\"}", (NR>1?",":""), $1, $2} END{print "]"}'

tui:
  components:
    stopped:
      type: toggle
      title: Stopped services

      # Common fields: https://jsdrews.github.io/tui-builder/reference/components/#common-fields
      # colors:                         # Per-component color overrides.
      #   border_active: ""             # Border color when focused.
      #   border_inactive: ""           # Border color when unfocused.
      #   spinner: ""                   # The loading spinner.

      # Toggle fields: https://jsdrews.github.io/tui-builder/reference/components/#toggle
      # initial: "false"                # `true` or `false`.
      # yes_label: "yes"                # The "true" side's label.
      # no_label: "no"                  # The "false" side's label.
    services:
      type: table
      title: Services
      source: services
      on_input:
        bind: {stopped: "${input.stopped}"}
      columns:
        - {title: Name,   value: name}
        - {title: Status, value: status}

  screen:
    layout:
      vstack:
        - {fixed: 3, component: stopped}
        - {component: services}
