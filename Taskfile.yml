version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Compile all binaries into ./bin
    cmds:
      - mkdir -p bin
      - go build -o bin/tui-builder ./cmd/tui-builder
      - go build -o bin/example-launcher ./cmd/example-launcher
      - go build -o bin/wrangl ./cmd/wrangl
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/tui-builder
      - bin/example-launcher
      - bin/wrangl

  examples:
    desc: Open the launcher listing every YAML in examples/
    cmds:
      - go run ./cmd/example-launcher

  example:
    desc: Run a single example by name — `task example NAME=table`
    requires:
      vars: [NAME]
    cmds:
      - go run ./cmd/tui-builder examples/{{.NAME}}.yaml

  wrangl:
    desc: "Run wrangl from the directory you invoked task from — pass args after `--`. Example: `task wrangl -- --list examples/http_countries.yaml`"
    # Build the binary from the project root (where the go module lives),
    # then run it from the user's shell CWD. That way relative paths in
    # CLI_ARGS (`./foo.yaml`, `../bar.yaml`) resolve the way you'd
    # expect — like calling wrangl directly.
    cmds:
      - go build -o bin/wrangl ./cmd/wrangl
      - cd "{{.USER_WORKING_DIR}}" && "{{.TASKFILE_DIR}}/bin/wrangl" {{.CLI_ARGS}}

  tui-builder:
    desc: "Run tui-builder"
    cmds:
      - go build -o bin/tui-builder ./cmd/tui-builder
      - cd "{{.USER_WORKING_DIR}}" && "{{.TASKFILE_DIR}}/bin/tui-builder" {{.CLI_ARGS}}

  wrangl:sources:
    desc: List the sources / pipelines defined in every examples/*.yaml
    # Build once, then run --list against each example. Reuses the shared
    # build task so we don't recompile per file like `task wrangl` would.
    deps: [build]
    cmds:
      - cmd: |
          for f in examples/*.yaml; do
            echo "=== $f ==="
            bin/wrangl --list "$f"
            echo
          done
        silent: true

  test:
    desc: Run go vet + go test + the data-layer import boundary check
    cmds:
      - go vet ./...
      - go test ./...
      - ./scripts/check-data-layer-boundary.sh

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Sync go.mod / go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove built binaries
    cmds:
      - rm -rf bin

  # ---- Kubernetes demo ----------------------------------------------------
  # Workflow:
  #   1. task kube:up        # creates a `tui-builder` kind cluster + seeds workloads
  #   2. task kube:proxy     # in another terminal — runs `kubectl proxy --port=8001`
  #   3. task kube:demo      # in this terminal — runs the kube.yaml example
  #   4. task kube:down      # tear it all down

  kube:up:
    desc: Create local kind cluster (name `tui-builder`) and seed demo workloads
    preconditions:
      - sh: command -v kind >/dev/null
        msg: kind not installed — run `brew install kind`
      - sh: command -v kubectl >/dev/null
        msg: kubectl not installed — run `brew install kubectl`
    cmds:
      - cmd: |
          if ! kind get clusters | grep -q '^tui-builder$'; then
            kind create cluster --name tui-builder
          else
            echo "kind cluster `tui-builder` already exists — skipping create"
          fi
        silent: true
      # Seed workloads. `|| true` keeps the task idempotent: re-running
      # after the resources exist is a no-op instead of an error.
      - kubectl --context kind-tui-builder create namespace demo || true
      - kubectl --context kind-tui-builder create deployment nginx   --image=nginx --replicas=3 || true
      - kubectl --context kind-tui-builder create deployment redis   --image=redis --replicas=1 || true
      - kubectl --context kind-tui-builder create deployment busybox --image=busybox --replicas=2 -- sleep infinity || true
      - kubectl --context kind-tui-builder create deployment crashy  --image=busybox -- /bin/sh -c "exit 1" || true
      - kubectl --context kind-tui-builder -n demo create deployment hello --image=nginxdemos/hello || true
      # Noisy pod so the logview tail in the TUI has something to show.
      - kubectl --context kind-tui-builder run noisy --image=busybox --restart=Never -- /bin/sh -c "while true; do date; sleep 1; done" || true
      - echo
      - echo "Ready. Next:"
      - "echo \"  task kube:proxy   # in another terminal\""
      - "echo \"  task kube:demo    # in this terminal\""

  kube:proxy:
    desc: Run `kubectl proxy --port=8001` (foreground — leave running in its own terminal)
    preconditions:
      - sh: command -v kubectl >/dev/null
        msg: kubectl not installed
    cmds:
      - kubectl --context kind-tui-builder proxy --port=8001

  kube:demo:
    desc: Run the kube example (requires kube:up + kube:proxy)
    cmds:
      - go run ./cmd/tui-builder examples/kube.yaml

  kube:down:
    desc: Delete the local kind cluster (data + workloads)
    preconditions:
      - sh: command -v kind >/dev/null
        msg: kind not installed
    cmds:
      - kind delete cluster --name tui-builder

  # ---- Multi-cluster kube demo --------------------------------------------
  # Three kind clusters (tb-prod / tb-staging / tb-dev) seeded with
  # different workloads, joined into one TUI table via a `merge` source.
  #
  # Workflow (each `proxy:{prod,staging,dev}` task is foreground — own terminal):
  #   terminal 1:  task kube:multi:up
  #   terminal 1:  task kube:multi:proxy:prod      # leave running
  #   terminal 2:  task kube:multi:proxy:staging   # leave running
  #   terminal 3:  task kube:multi:proxy:dev       # leave running
  #   terminal 4:  task kube:multi:check           # verify the 3 are reachable
  #   terminal 4:  task kube:multi:demo            # opens the TUI
  #   When done:  ctrl+c each proxy terminal, then `task kube:multi:down`
  #
  # Or skip the extra terminals: start/stop all 3 proxies in the background:
  #   task kube:multi:up
  #   task kube:multi:proxy:up      # all 3 proxies backgrounded
  #   task kube:multi:demo
  #   task kube:multi:proxy:down    # stop the proxies (then task kube:multi:down)

  kube:multi:up:
    desc: Create 3 local kind clusters (tb-prod / tb-staging / tb-dev) + seed workloads
    preconditions:
      - sh: command -v kind >/dev/null
        msg: kind not installed — run `brew install kind`
      - sh: command -v kubectl >/dev/null
        msg: kubectl not installed — run `brew install kubectl`
    cmds:
      # Create clusters idempotently.
      - cmd: |
          for c in tb-prod tb-staging tb-dev; do
            if kind get clusters 2>/dev/null | grep -q "^$c$"; then
              echo "kind cluster `$c` already exists — skipping create"
            else
              kind create cluster --name "$c"
            fi
          done
        silent: true
      # Seed differing workloads per cluster so the merged table is interesting.
      # prod: stable services
      - kubectl --context kind-tb-prod create deployment api      --image=nginx --replicas=4 || true
      - kubectl --context kind-tb-prod create deployment web      --image=nginx --replicas=3 || true
      - kubectl --context kind-tb-prod create deployment redis    --image=redis --replicas=1 || true
      # staging: similar but smaller
      - kubectl --context kind-tb-staging create deployment api   --image=nginx --replicas=2 || true
      - kubectl --context kind-tb-staging create deployment web   --image=nginx --replicas=2 || true
      - kubectl --context kind-tb-staging create deployment cache --image=redis --replicas=1 || true
      # dev: noisy + a deliberate crash-looper to exercise color rules
      - kubectl --context kind-tb-dev create deployment scratch   --image=busybox --replicas=1 -- sleep infinity || true
      - kubectl --context kind-tb-dev create deployment broken    --image=busybox -- /bin/sh -c "exit 1" || true
      - echo
      - echo "Ready. Run each proxy in its own terminal:"
      - "echo \"  task kube:multi:proxy:prod      # terminal 1\""
      - "echo \"  task kube:multi:proxy:staging   # terminal 2\""
      - "echo \"  task kube:multi:proxy:dev       # terminal 3\""
      - "echo \"  task kube:multi:demo            # main TUI\""

  kube:multi:proxy:prod:
    desc: Run kubectl proxy for tb-prod on :8001 (foreground — leave running)
    cmds:
      - kubectl --context kind-tb-prod proxy --port=8001

  kube:multi:proxy:staging:
    desc: Run kubectl proxy for tb-staging on :8002 (foreground — leave running)
    cmds:
      - kubectl --context kind-tb-staging proxy --port=8002

  kube:multi:proxy:dev:
    desc: Run kubectl proxy for tb-dev on :8003 (foreground — leave running)
    cmds:
      - kubectl --context kind-tb-dev proxy --port=8003

  kube:multi:proxy:up:
    desc: Start all 3 kubectl proxies in the background (prod:8001 / staging:8002 / dev:8003)
    preconditions:
      - sh: command -v kubectl >/dev/null
        msg: kubectl not installed
    cmds:
      # Runs under the system shell via `sh -c`: Task's built-in interpreter
      # evaluates a backgrounded (`&`) command's variables lazily in a
      # goroutine, which races the loop and crosses the per-proxy ports. A real
      # `sh` expands the args before forking, so each proxy binds its own port.
      # nohup + redirect detaches each proxy so it survives this task exiting.
      - cmd: |
          sh -c '
          mkdir -p .task/logs
          for entry in "tb-prod 8001" "tb-staging 8002" "tb-dev 8003"; do
            set -- $entry
            ctx="$1"; port="$2"
            if lsof -t -iTCP:${port} -sTCP:LISTEN >/dev/null 2>&1; then
              echo "kind-$ctx :$port already bound — skipping"
              continue
            fi
            nohup kubectl --context "kind-$ctx" proxy --port="$port" \
              >".task/logs/proxy-$ctx.log" 2>&1 &
            echo "started kind-$ctx proxy on :$port (pid $!, log .task/logs/proxy-$ctx.log)"
          done
          '
        silent: true
      - echo
      - "echo \"Verify:  task kube:multi:proxy:status   Stop all:  task kube:multi:proxy:down\""

  kube:multi:proxy:down:
    desc: Stop all 3 background kubectl proxies (prod:8001 / staging:8002 / dev:8003)
    cmds:
      - cmd: |
          for entry in "tb-prod 8001" "tb-staging 8002" "tb-dev 8003"; do
            set -- $entry
            ctx="$1"; port="$2"
            pid="$(lsof -t -iTCP:${port} -sTCP:LISTEN 2>/dev/null | head -1)"
            if [ -z "$pid" ]; then
              echo "kind-$ctx :$port not running"
              continue
            fi
            kill "$pid" 2>/dev/null && echo "stopped kind-$ctx proxy (:$port, pid $pid)"
          done
        silent: true

  kube:multi:proxy:status:
    desc: Show whether each proxy port is currently bound (regardless of who's listening)
    cmds:
      - cmd: |
          for entry in "tb-prod 8001" "tb-staging 8002" "tb-dev 8003"; do
            set -- $entry
            ctx="$1"; port="$2"
            pid="$(lsof -t -iTCP:${port} -sTCP:LISTEN 2>/dev/null | head -1)"
            if [ -n "$pid" ]; then
              printf "%-12s :%s  pid %s (%s)\n" "$ctx" "$port" "$pid" \
                "$(ps -p "$pid" -o comm= 2>/dev/null | xargs -I{} basename {})"
            else
              printf "%-12s :%s  not running\n" "$ctx" "$port"
            fi
          done
        silent: true

  kube:multi:check:
    desc: Diagnose the multi-cluster setup — clusters present? proxies up? returning pods?
    cmds:
      - cmd: |
          echo "==== kind clusters ===="
          kind get clusters 2>/dev/null | grep -E '^(tb-prod|tb-staging|tb-dev)$' || echo "(none found — run task kube:multi:up)"
          echo
          for entry in "tb-prod 8001" "tb-staging 8002" "tb-dev 8003"; do
            set -- $entry
            ctx="$1"; port="$2"
            echo "==== $ctx (port $port) ===="
            pid="$(lsof -t -iTCP:${port} -sTCP:LISTEN 2>/dev/null | head -1)"
            if [ -z "$pid" ]; then
              echo "proxy:    NOT RUNNING (run task kube:multi:proxy:$ctx in another terminal)"
              continue
            fi
            echo "proxy:    pid $pid bound to :$port"
            if ! curl -sf "http://localhost:${port}/api/v1/pods" >/dev/null; then
              echo "endpoint: /api/v1/pods FAILED"
              continue
            fi
            count="$(curl -s "http://localhost:${port}/api/v1/pods" | grep -o '"name"' | wc -l | tr -d ' ')"
            echo "endpoint: /api/v1/pods OK ($count pod metadata.name occurrences)"
          done
        silent: true

  kube:multi:demo:
    desc: Run the multi-cluster pods example (requires kube:multi:up + 3× proxy:* running)
    cmds:
      - go run ./cmd/tui-builder examples/kube_multi.yaml

  kube:multi:down:
    desc: Delete all 3 multi-cluster kind clusters
    preconditions:
      - sh: command -v kind >/dev/null
        msg: kind not installed
    cmds:
      - kind delete cluster --name tb-prod    || true
      - kind delete cluster --name tb-staging || true
      - kind delete cluster --name tb-dev     || true
