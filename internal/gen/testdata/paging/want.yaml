app:
  title: Paging
  version: "1"
  env:
    - name: PAGING_URL
      default: https://paging.example.com
      description: Base URL for Paging.
data:
  presets:
    paging:
      type: http
      url: ${env.PAGING_URL}
  sources:
    seek:
      extends: paging
      url: /seek
      window:
        offset_param: offset
        limit_param: limit
        page_size: 100
        total_path: header:X-Total-Count
        sort_param: sort
        sort_fields: [name, created_at]
        sort_desc_prefix: '-'
        sorts: {Created at: created_at}
        search_param: q
        filters: {Size: {gte: size_gte, lte: size_lte}, Kind: kind}
    pages:
      extends: paging
      url: /pages
      root: results
      paginate: {strategy: page, page_param: page, page_start: 0, limit_param: page_size, page_size: 25, stop_on_short_page: true, max_pages: 20}
    linked:
      extends: paging
      url: /linked
      paginate: {strategy: link, next_path: 'link:next', max_pages: 20}
    nexted:
      extends: paging
      url: /nexted
      root: results
      paginate: {strategy: link, next_path: next, max_pages: 20}
    cursored:
      extends: paging
      url: /cursored
      root: items
      paginate: {strategy: cursor, cursor_path: next_cursor, cursor_param: cursor, limit_param: limit, page_size: 100, max_pages: 20}
    stripey:
      extends: paging
      url: /stripey
      root: data
      paginate: {strategy: cursor, cursor_path: 'last:id', cursor_param: starting_after, limit_param: limit, page_size: 100, more_when: has_more, max_pages: 20}
    twice:
      extends: paging
      url: /twice
      root: data
      paginate: {strategy: page, page_param: page, limit_param: limit, page_size: 100, total_path: total, max_pages: 20}
    plain:
      extends: paging
      url: /plain
